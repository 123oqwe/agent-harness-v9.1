# Screen: enterprise_admin
screen_id: enterprise_admin
canonical_route: /admin
allowed_roles: ['admin']
experience_profile: advanced
purpose: "Enterprise Admin screen"

components:
  - org_settings
  - user_management
  - policy_editor
  - model_allowlist
  - tool_allowlist
  - audit_search
  - billing_dashboard
  - data_residency
  - kill_switch

data_dependencies:
  - GET /admin/policies
  - PUT /admin/policies
  - GET /admin/users
  - POST /admin/users
  - GET /admin/audit
  - GET /billing/usage

API_operations:
  - GET /admin/policies
  - PUT /admin/policies
  - GET /admin/users
  - POST /admin/users
  - GET /admin/audit
  - GET /billing/usage

stream_events:
  - run_event_stream

permissions:
  - admin:read
  - admin:write
  - admin:users
  - audit:read
  - billing:read

loading_state:
  component: progressive_loader
  timeout_ms: 5000

empty_state:
  message: "No data available"
  action: "Get started"

partial_state:
  message: "Loading partial results"
  show_cached: true

success_state:
  message: "Complete"
  show_evidence: true

error_state:
  message: "Something went wrong"
  retry: true
  show_details: true

offline_state:
  message: "You are offline"
  cached_data: true
  queue_actions: true

blocked_state:
  message: "This action is blocked"
  reason: "policy_or_permission"

approval_state:
  message: "Waiting for approval"
  show_preview: true

accessibility:
  keyboard_navigation: true
  screen_reader: true
  aria_labels: true
  high_contrast: true
  focus_indicators: true
  reduced_motion: true

keyboard_navigation:
  - tab: next_element
  - shift+tab: previous_element
  - enter: activate
  - escape: close_dialog

responsive_behavior:
  mobile: stacked_layout
  tablet: sidebar_layout
  desktop: full_layout

analytics_events:
  - screen_view
  - user_action
  - error_occurred

E2E_tests:
  - tests/e2e/enterprise_admin.spec.ts

visual_regression_tests:
  - tests/visual/enterprise_admin.spec.ts
