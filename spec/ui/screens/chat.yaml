# Screen: chat
screen_id: chat
canonical_route: /
allowed_roles: ['user', 'admin']
experience_profile: advanced
purpose: "Chat screen"

components:
  - message_list
  - input_bar
  - model_selector
  - budget_indicator
  - run_plan_preview
  - tool_status_panel

data_dependencies:
  - POST /runs
  - GET /runs/{runId}/events
  - POST /runs/{runId}/steer

API_operations:
  - POST /runs
  - GET /runs/{runId}/events
  - POST /runs/{runId}/steer

stream_events:
  - run_event_stream

permissions:
  - runs:read
  - runs:write
  - runs:steer

loading_state:
  component: progressive_loader
  timeout_ms: 5000

empty_state:
  message: "No data available"
  action: "Get started"

partial_state:
  message: "Loading partial results"
  show_cached: true

success_state:
  message: "Complete"
  show_evidence: true

error_state:
  message: "Something went wrong"
  retry: true
  show_details: true

offline_state:
  message: "You are offline"
  cached_data: true
  queue_actions: true

blocked_state:
  message: "This action is blocked"
  reason: "policy_or_permission"

approval_state:
  message: "Waiting for approval"
  show_preview: true

accessibility:
  keyboard_navigation: true
  screen_reader: true
  aria_labels: true
  high_contrast: true
  focus_indicators: true
  reduced_motion: true

keyboard_navigation:
  - tab: next_element
  - shift+tab: previous_element
  - enter: activate
  - escape: close_dialog

responsive_behavior:
  mobile: stacked_layout
  tablet: sidebar_layout
  desktop: full_layout

analytics_events:
  - screen_view
  - user_action
  - error_occurred

E2E_tests:
  - tests/e2e/chat.spec.ts

visual_regression_tests:
  - tests/visual/chat.spec.ts

states:
  idle:
    description: "No active run"
    visible_components: [message_list, input_bar, model_selector]
    disabled_components: [tool_status_panel, budget_indicator]
  running:
    description: "Run in progress"
    visible_components: [message_list, input_bar, tool_status_panel, budget_indicator, run_plan_preview]
    input_bar_state: "disabled"
    cancel_button: visible
  awaiting_approval:
    description: "Tool execution awaiting user approval"
    visible_components: [message_list, approval_panel]
    input_bar_state: "disabled"
  error:
    description: "Run failed"
    visible_components: [message_list, error_banner, retry_button]
    error_banner: "Shows error classification and suggested action"
  completed:
    description: "Run finished successfully"
    visible_components: [message_list, evidence_panel, input_bar]
    evidence_panel: "Shows evidence package summary"
