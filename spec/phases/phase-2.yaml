phase: 2
name: Context, RAG, Multimodal & Product UX
status: BLOCKED
objective: Context, RAG, Multimodal & Product UX
delivers:
- Nine-layer Context Compiler with active-plan injection, VFS offload, aligned compaction,
  context reset, and progressive disclosure
- ACL-before-retrieval hybrid RAG with provenance, citations, deletion propagation,
  migration, and injection isolation
- Session tree, steering, pause/resume, full budget ledger, and model fallback
- MCP stdio allowlist, multimodal/document tool expansion, web/desktop/TUI product
  surfaces, and optional rootless OCI sandbox
