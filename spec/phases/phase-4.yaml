phase: 4
name: "Memory, Assurance, Observability & Evolution Shadow"
status: BLOCKED
objective: "Memory, Assurance, Observability & Evolution Shadow"

delivers:
  - "Six memory types with provenance, trust, TTL, conflict resolution, approval, local-only handling, deletion propagation, backend API, and frontend center"
  - "Consented user personalization as a proposal track separate from agent capability evolution"
  - "Advanced evaluation, independent verification, redacted traces, replay, events, and OTel export"
  - "Offline, replay, shadow, rollback, drift, dedup, and tech-debt evolution; generated tools remain untrusted shadow candidates"

