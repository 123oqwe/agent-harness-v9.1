phase: 1
name: "Single-Agent Multi-Domain Foundation"
status: BLOCKED
objective: "Single-Agent Multi-Domain Foundation"

dependencies:
  - phase-0

enabled_domains:
  - coding
  - documents
  - research
  - writing
  - planning
  - personal_assistant

disabled_capabilities:
  - external_write
  - multi_agent
  - dynamic_tool_generation

requirements:
  - AH-GATEWAY-TESTPROVIDER-001  # MUST be first — all verticals depend on it
  - AH-CAPABILITY-001
  - AH-CAPMAP-002
  - AH-CAPMAP-006
  - AH-CAPMAP-013
  - AH-CAPMAP-017
  - AH-CAPMAP-020
  - AH-CODING-VERTICAL-001
  - AH-DOC-VERTICAL-001
  - AH-EVIDENCE-001
  - AH-PA-VERTICAL-001
  - AH-PLANNING-VERTICAL-001
  - AH-POLICY-ENGINE-001
  - AH-RESEARCH-VERTICAL-001
  - AH-RUNTIME-LOOP-001
  - AH-RUNTIME-SESSION-001
  - AH-SANDBOX-001
  - AH-TOOL-EDIT-001
  - AH-TOOL-EXEC-001
  - AH-TOOL-READ-001
  - AH-TOOL-SEARCH-001
  - AH-TOOL-WRITE-001
  - AH-UI-APPROVAL-001
  - AH-UI-CHAT-001
  - AH-UI-CODING-001
  - AH-UI-EVIDENCE-001
  - AH-UI-ONBOARDING-001
  - AH-UI-PRIVACY-001
  - AH-UI-SETTINGS-001
  - AH-UI-TASK-001
  - AH-WRITING-VERTICAL-001

fixtures:
  - fixtures/phase-1/valid/
  - fixtures/phase-1/invalid/

unit_tests: "harness/tests/"
integration_tests: "harness/tests/domain/"
e2e_tests: "harness/tests/domain/"
security_tests: "harness/tests/security/"

domain_evals:
  coding: "evals/coding/phase-1.yaml"
  documents: "evals/documents/phase-1.yaml"
  research: "evals/research/phase-1.yaml"
  writing: "evals/writing/phase-1.yaml"
  planning: "evals/planning/phase-1.yaml"
  personal_assistant: "evals/personal_assistant/phase-1.yaml"

real_data_tests:
  synthetic: "data-tests/synthetic/phase-1/"
  public_benchmarks: "data-tests/public-benchmarks/phase-1/"
  consented_staging: "data-tests/consented-staging/phase-1/"

deployment_target:
  phase_0: "N/A - specification only"
  phase_1: "local"
  phase_2: "local"
  phase_3: "local"
  phase_4: "local + staging"
  phase_5: "staging"
  phase_6: "staging"
  phase_7: "canary"
  phase_8: "production"

gate_command: "python3 factory/phase-gates/gate_runner.py phase1"
rollback: "auto-rollback if gate fails"
evidence: "artifacts/phase-1/"

entry_criteria:
  - "Previous phase gate passed"
  - "All dependencies verified"
  - "No open P0 blockers"

exit_criteria:
  - domain_evals_all_pass: true
  - coding_vertical: "read repo -> fix bug -> run tests -> diff"
  - documents_vertical: "read PDF -> extract -> summarize -> cite pages"
  - research_vertical: "read sources -> organize evidence -> report"
  - writing_vertical: "brief -> draft -> self-check -> output"
  - planning_vertical: "goal+constraints -> plan -> validate deps"
  - pa_vertical: "task list -> daily plan (no external action)"
  - security: sandbox_violation=0, unauthorized_effect=0, capability_replay=0
  - active_stub_count: 0
  - mutation_score: ">= 0.7"
  - crash_restore_no_duplicate: PASS

blocked_conditions:
  - "Previous phase gate not passed"
  - "Open P0 blockers"
  - "Missing dependencies"
  - "Test environment unavailable"
