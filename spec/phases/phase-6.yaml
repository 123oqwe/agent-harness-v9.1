rollback: "auto-rollback if gate fails"
evidence: "artifacts/phase-6/"

entry_criteria:
  - "Previous phase gate passed"
  - "All dependencies verified"
  - "No open P0 blockers"

exit_criteria:
  - all_phase_requirements_verified: true
  - regression_tests_pass: true
  - active_stub_count: 0
  - independent_glm_5_2_xhigh: PASS

blocked_conditions:
  - "Previous phase gate not passed"
  - "Open P0 blockers"
  - "Missing dependencies"
  - "Test environment unavailable"
