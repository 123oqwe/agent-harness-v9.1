phase: 6
name: "Mission Layer, Routines & Proactive Assistant"
status: BLOCKED
objective: "Mission Layer, Routines & Proactive Assistant"

delivers:
  - "Mission decomposition, state, budget, cancellation, cross-domain execution, open-loop tracking, watches, and founder/operator templates"
  - "Durable cron/routines with timezone and DST rules, leases, idempotent occurrences, overlap/concurrency limits, missed-run policy, and fresh authorization/context"
  - "Sandbox sleep/wake, proactive suggestions, relationship follow-up, daily brief and mission UI"
  - "schedule_task, real-time voice, voice cloning with biometric consent, and remote/mobile channel behavior"

