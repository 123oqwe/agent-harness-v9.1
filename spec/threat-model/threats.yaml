- threat_id: THREAT-CRED-REACH
  threat: Credential exfiltration via compromised agent loop
  asset: ASSET-002
  trust_boundary: TB-001
  attack_preconditions: [Agent loop compromised by indirect injection or tool poisoning, tool requiring credentials is callable]
  attack_steps: [Injection compromises loop, Loop calls credentialed tool, Broker exchanges credential into process env, Second tool call exfils credential to attacker host]
  control_ids: [CTRL-RUNPHASE-001, CTRL-CRED-REACH-001, CTRL-EGRESS-002]
  implementation_location: harness/security/run-phase.ts
  test_fixture: tests/security/cred-reach.test.ts
  expected_result: Agent phase offline by default, credentials stripped before agent phase, single-exchange scoped to one dispatch
  residual_risk: low

