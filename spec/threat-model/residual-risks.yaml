# Residual Risks
- threat_id: THREAT-INDIRECT-INJECTION
  residual: low
  reason: Taint labels provide defense but sophisticated injection may still work
  mitigation: Continuous adversarial testing, prompt hardening
- threat_id: THREAT-MEMORY-POISONING
  residual: medium
  reason: Memory verification depends on LLM judgment which can be fooled
  mitigation: TTL + quarantine + user review of memory writes

- issue_id: AR-001
  severity: P2
  category: undefined_terms
  description: 'ExperienceProfile' referenced in RunPlan but not defined as a schema
  file: contracts/run-plan.schema.json
  proposed_fix: Add experience-profile.schema.json or define inline

- issue_id: AR-003
  severity: P2
  category: provider_assumptions
  description: Gmail adapter assumes provider receipt and sent-folder readback. Not all email providers support this.
  file: requirements/requirements.ndjson (AH-EXT-GMAIL-001)
  proposed_fix: Mark as NEEDS_PROVIDER_VERIFICATION until tested with real Gmail API

- issue_id: AR-004
  severity: P2
  category: missing_ui_states
  description: Screen specs don't define 'permission denied' state separately from error state
  file: ui/screens/
  proposed_fix: Add permission_denied_state to screen specs

- issue_id: AR-005
  severity: P3
  category: phase_dependencies
  description: Phase 4 has no requirements listed in phase-4.yaml but is BLOCKED_BY_PHASE_3. Needs at least Evolution requirements.
  file: phases/phase-4.yaml
  proposed_fix: Add Phase 4 requirements (Evolution, Observability, Memory) to requirements.ndjson

- issue_id: AR-006
  severity: P2
  category: unmeasurable_metrics
  description: 'routing_regret' metric defined but no formula or measurement method specified
  file: phases/phase-3.yaml
  proposed_fix: Define: routing_regret = (best_possible_score - actual_score) / best_possible_score

- issue_id: AR-009
  severity: P2
  category: missing_backend_contracts
  description: No WebSocket contract for real-time event streaming (only SSE in OpenAPI)
  file: api/
  proposed_fix: Add WebSocket spec to asyncapi.yaml for bidirectional communication

- issue_id: AR-010
  severity: P2
  category: missing_admin_functions
  description: No admin API for user management (create/delete/suspend users)
  file: api/openapi.yaml
  proposed_fix: Add /admin/users endpoints

- issue_id: AR-011
  severity: P2
  category: missing_data_controls
  description: No data contamination detection mechanism between training and eval datasets
  file: data-tests/
  proposed_fix: Add contamination check: hash overlap detection between eval and training data

- issue_id: AR-012
  severity: P2
  category: missing_ops
  description: No runbook for 'budget exceeded across all users' scenario
  file: operations/runbooks/
  proposed_fix: Add budget-exhaustion runbook

- issue_id: AR-013
  severity: P3
  category: circular_dependency
  description: Evolution optimizes Router, but Router feeds data to Evolution. Potential feedback loop.
  file: architecture/evolution.md
  proposed_fix: Already mitigated by: Evolution shadow mode only, cold start safety, Self-Model protection

- issue_id: AR-015
  severity: P2
  category: missing_tests
  description: No TypeScript/Schema parity test defined. How to verify TS types match JSON Schemas?
  file: contracts/
  proposed_fix: Add contract-parity.test.ts that validates TS interfaces against JSON Schemas

