<text x="500" y="375" fill="#f85149" font-size="9" font-weight="bold">jws: 完整性+真实性</text>
<text x="500" y="390" fill="#8b949e" font-size="9">jwe (可选): 共享 broker 保密</text>
<text x="640" y="330" fill="#fbbf24" font-size="9" font-weight="bold">Phase 3 前置:</text>
<text x="640" y="345" fill="#8b949e" font-size="9">1. F8 消息安全</text>
<text x="640" y="360" fill="#8b949e" font-size="9">2. CTRL-CONTEXT-ISOLATION</text>
<text x="640" y="375" fill="#8b949e" font-size="9">3. CTRL-TOOL-MASK-001</text>
<text x="640" y="390" fill="#8b949e" font-size="9">  (否则 DAG 经济不可行)</text>

