<rect x="0" y="0" width="1400" height="920" fill="#0d1117" rx="8"/>
<text x="20" y="28" fill="#fbcfe8" font-size="15" font-weight="bold">Runtime Topology — 三阶段演进 (v9)</text>
<text x="20" y="46" fill="#8b949e" font-size="11">Phase 1 单进程 → Phase 3 跨进程(F8 obo+jws) → Phase 5 跨主机+外部 · runtime-topology.md · harness-boundary.md 通信演进</text>

