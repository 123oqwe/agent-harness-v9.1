<!-- Module independence -->
<rect x="20" y="710" width="1360" height="190" fill="#161b22" stroke="#30363d" rx="6"/>
<text x="700" y="730" fill="#fbcfe8" font-size="12" font-weight="bold" text-anchor="middle">模块依赖方向 (harness-boundary.md, 无循环)</text>
<text x="40" y="755" fill="#3fb950" font-size="9">runtime → contracts + security/context/VFS/gateway interfaces</text>
<text x="300" y="755" fill="#58a6ff" font-size="9">router → contracts + registry reads + Policy constraints (not Runtime)</text>
<text x="700" y="755" fill="#e3b341" font-size="9">tools → registry + PEP + VFS + sandbox</text>
<text x="1000" y="755" fill="#39c5cf" font-size="9">vfs: 独立, 被 tools/RAG/memory 共用</text>
<text x="40" y="780" fill="#8b949e" font-size="9">验证: madge --circular (构建时)</text>
<text x="40" y="800" fill="#fbbf24" font-size="9">5 横切平面:</text>
<text x="40" y="815" fill="#8b949e" font-size="9">Control (Router+Policy) · Data (Runtime+ToolHost) · Observability (Audit+Trace) · Identity (AuthService) · Budget (BudgetGuard+PEP)</text>
<text x="40" y="840" fill="#f85149" font-size="9">安全边界: Process (P1) → Process+Message (P3) → Host+External (P5)</text>
<text x="40" y="855" fill="#8b949e" font-size="9">每个边界对应的 CTRL 在 security-control-mapping.md 定义</text>
<text x="40" y="880" fill="#3fb950" font-size="9">Phase 1 实现注意: 不需要 event bus / tRPC 内部 / Redis / Temporal — 这些是 Phase 4+</text>
