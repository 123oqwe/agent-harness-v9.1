<?xml version="1.0" encoding="UTF-8"?>
<!-- Complete Execution Flow — User Input → RunConfiguration → Execution → Outcome -->
<svg width="1400" height="880" viewBox="0 0 1400 880" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="ar" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#8b949e"/></marker>
<marker id="ab" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#58a6ff"/></marker>
<marker id="ag" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#3fb950"/></marker>
</defs>
<rect x="0" y="0" width="1400" height="880" fill="#0d1117" rx="8"/><text x="20" y="28" fill="#f0f0f5" font-size="15" font-weight="bold">Complete Execution Flow — User Input → RunConfiguration → Execution → Outcome (v8)</text>
<text x="20" y="46" fill="#8b949e" font-size="11">Harness 永久存在 · 每次输入 → Router 生成 RunConfiguration → Runtime Core 执行 · 不是创建新 Harness</text>
<rect x="450" y="65" width="500" height="35" fill="#161b22" stroke="#f0f0f5" stroke-width="2" rx="6"/>
<text x="460" y="83" fill="#f0f0f5" font-size="11" font-weight="bold">1. User Input</text>
<text x="460" y="99" fill="#8b949e" font-size="9">文本/文件/图片/URL/语音</text>
<line x1="700" y1="100" x2="700" y2="120" stroke="#8b949e" stroke-width="1" marker-end="url(#ab)"/>
<rect x="450" y="110" width="500" height="35" fill="#161b22" stroke="#6b7280" stroke-width="2" rx="6"/>
<text x="460" y="128" fill="#6b7280" font-size="11" font-weight="bold">2. Input Normalizer</text>
<text x="460" y="144" fill="#8b949e" font-size="9">解析多模态输入</text>
<line x1="700" y1="145" x2="700" y2="165" stroke="#8b949e" stroke-width="1" marker-end="url(#ab)"/>
<rect x="450" y="155" width="500" height="35" fill="#161b22" stroke="#6b7280" stroke-width="2" rx="6"/>
<text x="460" y="173" fill="#6b7280" font-size="11" font-weight="bold">3. Fast Preflight (0 LLM)</text>
<text x="460" y="189" fill="#8b949e" font-size="9">权限/模态/风险/Provider可用性/预算</text>
<line x1="700" y1="190" x2="700" y2="210" stroke="#8b949e" stroke-width="1" marker-end="url(#ab)"/>
<rect x="450" y="200" width="500" height="35" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
<text x="460" y="218" fill="#58a6ff" font-size="11" font-weight="bold">4. Task Profiler (1 LLM)</text>
<text x="460" y="234" fill="#8b949e" font-size="9">Intent+Domain+Modality+Complexity+Ambiguity</text>
<text x="100" y="250" fill="#fbcfe8" font-size="12" font-weight="bold">5. Parallel Candidate Resolution (0 LLM, 确定性)</text>
<rect x="50" y="260" width="200" height="40" fill="#161b22" stroke="#3fb950" stroke-width="2" rx="6"/>
<text x="60" y="278" fill="#3fb950" font-size="10" font-weight="bold">Strategy Router</text>
<rect x="270" y="260" width="200" height="40" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
<text x="280" y="278" fill="#58a6ff" font-size="10" font-weight="bold">Agent Topology</text>
<rect x="490" y="260" width="200" height="40" fill="#161b22" stroke="#bc8cff" stroke-width="2" rx="6"/>
<text x="500" y="278" fill="#bc8cff" font-size="10" font-weight="bold">Context Topology v8</text>
<rect x="710" y="260" width="200" height="40" fill="#161b22" stroke="#fbbf24" stroke-width="2" rx="6"/>
<text x="720" y="278" fill="#fbbf24" font-size="10" font-weight="bold">Model/API v8</text>
<rect x="930" y="260" width="200" height="40" fill="#161b22" stroke="#e3b341" stroke-width="2" rx="6"/>
<text x="940" y="278" fill="#e3b341" font-size="10" font-weight="bold">Tool Router</text>
<rect x="1150" y="260" width="200" height="40" fill="#161b22" stroke="#f778ba" stroke-width="2" rx="6"/>
<text x="1160" y="278" fill="#f778ba" font-size="10" font-weight="bold">Skill Router</text>
<rect x="270" y="310" width="630" height="40" fill="#161b22" stroke="#39c5cf" stroke-width="2" rx="6"/>
<text x="280" y="328" fill="#39c5cf" font-size="10" font-weight="bold">Execution Env Router + Verification Router</text>
<rect x="350" y="365" width="700" height="45" fill="#1a0808" stroke="#f85149" stroke-width="2" rx="6"/>
<text x="360" y="383" fill="#f85149" font-size="11" font-weight="bold">6. Global Route Optimizer</text>
<text x="360" y="399" fill="#8b949e" font-size="9">RouteScore = success+quality-cost-latency-risk-pressure-coordination</text>
<rect x="350" y="420" width="700" height="35" fill="#161b22" stroke="#d29922" stroke-width="2" rx="6"/>
<text x="360" y="438" fill="#d29922" font-size="11" font-weight="bold">7. Policy Validator</text>
<text x="360" y="454" fill="#8b949e" font-size="9">删除越权或不安全候选</text>
<rect x="250" y="470" width="900" height="60" fill="#1a0808" stroke="#fbcfe8" stroke-width="2" rx="6"/>
<text x="260" y="488" fill="#fbcfe8" font-size="12" font-weight="bold">8. RunConfiguration</text>
<text x="260" y="504" fill="#8b949e" font-size="10">strategy + workflow_patterns + agent_topology + context_topology + primary_model + fallback_models</text>
<text x="260" y="518" fill="#8b949e" font-size="9">selected_tools + selected_skills + execution_environment + policies + limits + routing_evidence</text>
<rect x="300" y="545" width="800" height="50" fill="#161b22" stroke="#3fb950" stroke-width="2" rx="6"/>
<text x="310" y="563" fill="#3fb950" font-size="11" font-weight="bold">9. Agent Runtime Core</text>
<text x="310" y="579" fill="#8b949e" font-size="9">Loop · Scheduler · State · Streaming · Single/Multi/Swarm lifecycle</text>
<text x="310" y="593" fill="#8b949e" font-size="8">Pause / Retry / Resume / Re-route</text>
<rect x="200" y="610" width="1000" height="55" fill="#1a0808" stroke="#f85149" stroke-width="2" rx="6"/>
<text x="210" y="628" fill="#f85149" font-size="11" font-weight="bold">10. PEP Execution</text>
<text x="210" y="644" fill="#8b949e" font-size="9">verify token + manifest_hash + resource_versions + preconditions + replay</text>
<text x="210" y="658" fill="#8b949e" font-size="8">execute tool · Secrets Broker inject credential · BudgetGuard扣减 · trace span</text>
<rect x="200" y="680" width="1000" height="45" fill="#1a1208" stroke="#fbbf24" stroke-width="2" rx="6"/>
<text x="210" y="698" fill="#fbbf24" font-size="11" font-weight="bold">11. Runtime Monitor + Re-router</text>
<text x="210" y="714" fill="#8b949e" font-size="9">re-route? (strategy/model/topology/context) · fallback? · budget?</text>
<text x="210" y="728" fill="#8b949e" font-size="8">不重新造Harness, 只重新路由</text>
<rect x="300" y="740" width="800" height="45" fill="#161b22" stroke="#3fb950" stroke-width="2" rx="6"/>
<text x="310" y="758" fill="#3fb950" font-size="11" font-weight="bold">12. Verification & Recovery</text>
<text x="310" y="774" fill="#8b949e" font-size="9">确定性检查 → fail → re-route → reconcile/compensate/revert</text>
<rect x="300" y="800" width="800" height="50" fill="#1a0808" stroke="#fbcfe8" stroke-width="2" rx="6"/>
<text x="310" y="818" fill="#fbcfe8" font-size="11" font-weight="bold">13. Task Complete</text>
<text x="310" y="834" fill="#8b949e" font-size="9">TaskExecutionRecord → Evolution Engine (Observe+Extract) → SelfModel update</text>
<text x="310" y="848" fill="#8b949e" font-size="8">输出结果 + trace</text>
<line x1="700" y1="100" x2="700" y2="110" stroke="#8b949e" stroke-width="1" marker-end="url(#ab)"/>
<line x1="700" y1="145" x2="700" y2="155" stroke="#8b949e" stroke-width="1" marker-end="url(#ab)"/>
<line x1="700" y1="190" x2="700" y2="200" stroke="#8b949e" stroke-width="1" marker-end="url(#ab)"/>
<line x1="700" y1="235" x2="700" y2="250" stroke="#8b949e" stroke-width="1" marker-end="url(#ab)"/>
<line x1="700" y1="305" x2="700" y2="365" stroke="#8b949e" stroke-width="1" marker-end="url(#ab)"/>
<line x1="700" y1="410" x2="700" y2="420" stroke="#8b949e" stroke-width="1" marker-end="url(#ab)"/>
<line x1="700" y1="455" x2="700" y2="470" stroke="#8b949e" stroke-width="1" marker-end="url(#ab)"/>
<line x1="700" y1="530" x2="700" y2="545" stroke="#8b949e" stroke-width="1" marker-end="url(#ab)"/>
<line x1="700" y1="595" x2="700" y2="610" stroke="#8b949e" stroke-width="1" marker-end="url(#ab)"/>
<line x1="700" y1="665" x2="700" y2="680" stroke="#8b949e" stroke-width="1" marker-end="url(#ab)"/>
<line x1="700" y1="725" x2="700" y2="740" stroke="#8b949e" stroke-width="1" marker-end="url(#ab)"/>
<line x1="700" y1="785" x2="700" y2="800" stroke="#8b949e" stroke-width="1" marker-end="url(#ab)"/>
<path d="M 1100 740 Q 1200 500 1100 365" fill="none" stroke="#58a6ff" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ab)"/>
<text x="1150" y="550" fill="#58a6ff" font-size="10">L9 fail → re-route</text>
<path d="M 300 800 Q 100 600 300 545" fill="none" stroke="#3fb950" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ag)"/>
<text x="150" y="680" fill="#3fb950" font-size="9">Evolution → optimize</text>
<rect x="50" y="835" width="1300" height="35" fill="#1a0808" stroke="#fbcfe8" stroke-width="2" rx="6"/>
<text x="60" y="853" fill="#fbcfe8" font-size="11" font-weight="bold">关键: 第11步不是重新搭建Harness · 只是局部重新路由 · Harness永久存在 · RunConfiguration是本次运行配置</text>
</svg>
