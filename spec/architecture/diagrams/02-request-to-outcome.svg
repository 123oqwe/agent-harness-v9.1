<line x1="350" y1="138" x2="350" y2="146" stroke="#8b949e" stroke-width="1" marker-end="url(#ar)"/>
<rect x="30" y="146" width="640" height="28" fill="#21262d" stroke="#8b949e" stroke-width="1" rx="4"/><text x="45" y="164" fill="#8b949e" font-size="9" font-weight="bold">02</text><text x="75" y="164" fill="#f0f6fc" font-size="10">Identity Resolution</text>
