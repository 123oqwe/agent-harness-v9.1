<rect x="0" y="0" width="1400" height="1000" fill="#0d1117" rx="8"/>
<text x="20" y="28" fill="#fbcfe8" font-size="15" font-weight="bold">Request-to-Outcome Pipeline (v9) — 20 步顺序流水线</text>
<text x="20" y="46" fill="#8b949e" font-size="11">request-to-outcome.md · v9: Policy 在 S3(路由前) · PEP 每个动作 · 顺序非并行 · Memory Write 带 PII 检查</text>
