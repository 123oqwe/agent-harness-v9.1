<line x1="350" y1="396" x2="350" y2="404" stroke="#8b949e" stroke-width="1" marker-end="url(#ar)"/>
<rect x="30" y="404" width="640" height="28" fill="#21262d" stroke="#bc8cff" stroke-width="1" rx="4"/><text x="45" y="422" fill="#bc8cff" font-size="9" font-weight="bold">09</text><text x="75" y="422" fill="#f0f6fc" font-size="10">ContextGraph Planning</text><text x="350" y="422" fill="#8b949e" font-size="8">7 拓扑 · F8 cross-process</text>
<line x1="350" y1="432" x2="350" y2="440" stroke="#8b949e" stroke-width="1" marker-end="url(#ar)"/>
<rect x="30" y="440" width="640" height="28" fill="#21262d" stroke="#e3b341" stroke-width="1" rx="4"/><text x="45" y="458" fill="#e3b341" font-size="9" font-weight="bold">10</text><text x="75" y="458" fill="#f0f6fc" font-size="10">VerificationGraph Planning</text>
<line x1="350" y1="468" x2="350" y2="476" stroke="#8b949e" stroke-width="1" marker-end="url(#ar)"/>
<rect x="30" y="476" width="640" height="28" fill="#21262d" stroke="#fbbf24" stroke-width="1" rx="4"/><text x="45" y="494" fill="#fbbf24" font-size="9" font-weight="bold">11</text><text x="75" y="494" fill="#f0f6fc" font-size="10">Joint Constraint Solver</text><text x="350" y="494" fill="#8b949e" font-size="8">贪心 → CSP (regret&gt;15%)</text>
<line x1="350" y1="504" x2="350" y2="512" stroke="#8b949e" stroke-width="1" marker-end="url(#ar)"/>
<rect x="30" y="512" width="640" height="28" fill="#1a0808" stroke="#f85149" stroke-width="1" rx="4"/><text x="45" y="530" fill="#f85149" font-size="9" font-weight="bold">12</text><text x="75" y="530" fill="#f0f6fc" font-size="10">Policy Validation</text>
<line x1="350" y1="540" x2="350" y2="548" stroke="#8b949e" stroke-width="1" marker-end="url(#ar)"/>
<rect x="30" y="548" width="640" height="38" fill="#1a0808" stroke="#fbcfe8" stroke-width="3" rx="4"/><text x="45" y="566" fill="#fbcfe8" font-size="10" font-weight="bold">13</text><text x="75" y="566" fill="#fbcfe8" font-size="11" font-weight="bold">RunPlan Freeze</text><text x="75" y="580" fill="#8b949e" font-size="8">22 必填字段 · run_plan_hash · 唯一执行契约</text>
<rect x="710" y="70" width="680" height="840" fill="#161b22" stroke="#30363d" rx="6"/>
<text x="1050" y="92" fill="#3fb950" font-size="12" font-weight="bold" text-anchor="middle">执行 + 验证 + 产出 (步骤 14-20)</text>
<line x1="670" y1="567" x2="710" y2="120" stroke="#3fb950" stroke-width="2" marker-end="url(#ag)"/>
<rect x="730" y="110" width="640" height="38" fill="#21262d" stroke="#3fb950" stroke-width="2" rx="4"/><text x="745" y="128" fill="#3fb950" font-size="9" font-weight="bold">14</text><text x="775" y="128" fill="#f0f6fc" font-size="10">Runtime Execution</text><text x="775" y="142" fill="#8b949e" font-size="8">F2: setup(network) → agent(offline, 凭证剥离)</text>
<line x1="1050" y1="148" x2="1050" y2="156" stroke="#8b949e" stroke-width="1" marker-end="url(#ar)"/>
<rect x="730" y="156" width="640" height="38" fill="#1a0808" stroke="#f85149" stroke-width="2" rx="4"/><text x="745" y="174" fill="#f85149" font-size="9" font-weight="bold">15</text><text x="775" y="174" fill="#f0f6fc" font-size="10">Per-Action Authorization (PEP)</text><text x="775" y="188" fill="#f85149" font-size="8">★ 每个动作 · CTRL-REVALIDATE-001 · CTRL-CAPABILITY-SINGLE-USE-001</text>
<line x1="1050" y1="194" x2="1050" y2="202" stroke="#8b949e" stroke-width="1" marker-end="url(#ar)"/>
<rect x="730" y="202" width="640" height="38" fill="#21262d" stroke="#e3b341" stroke-width="1" rx="4"/><text x="745" y="220" fill="#e3b341" font-size="9" font-weight="bold">16</text><text x="775" y="220" fill="#f0f6fc" font-size="10">Tool / Model Execution</text><text x="775" y="234" fill="#8b949e" font-size="8">VFS dispatch (F4) · Sandbox · CTRL-EGRESS-002 · CTRL-SCREEN-ISOLATION-001</text>
<line x1="1050" y1="240" x2="1050" y2="248" stroke="#8b949e" stroke-width="1" marker-end="url(#ar)"/>
<rect x="730" y="248" width="640" height="38" fill="#21262d" stroke="#e3b341" stroke-width="1" rx="4"/><text x="745" y="266" fill="#e3b341" font-size="9" font-weight="bold">17</text><text x="775" y="266" fill="#f0f6fc" font-size="10">Verification</text><text x="775" y="280" fill="#8b949e" font-size="8">独立验证器 · 不同模型族 · 只读 · E0-E7 evidence</text>
<line x1="1050" y1="286" x2="1050" y2="294" stroke="#8b949e" stroke-width="1" marker-end="url(#ar)"/>
<rect x="730" y="294" width="640" height="38" fill="#21262d" stroke="#fbbf24" stroke-width="1" rx="4"/><text x="745" y="312" fill="#fbbf24" font-size="9" font-weight="bold">18</text><text x="775" y="312" fill="#f0f6fc" font-size="10">Reconciliation</text><text x="775" y="326" fill="#8b949e" font-size="8">EFFECT_UNKNOWN → 对账 (diagram 12)</text>
<line x1="1050" y1="332" x2="1050" y2="340" stroke="#8b949e" stroke-width="1" marker-end="url(#ar)"/>
<rect x="730" y="340" width="640" height="38" fill="#21262d" stroke="#3fb950" stroke-width="2" rx="4"/><text x="745" y="358" fill="#3fb950" font-size="9" font-weight="bold">19</text><text x="775" y="358" fill="#f0f6fc" font-size="10">Outcome Package</text><text x="775" y="372" fill="#8b949e" font-size="8">交付物(可用物件, 非文字总结)</text>
<line x1="1050" y1="378" x2="1050" y2="386" stroke="#8b949e" stroke-width="1" marker-end="url(#ar)"/>
<rect x="730" y="386" width="640" height="38" fill="#1a0808" stroke="#bc8cff" stroke-width="2" rx="4"/><text x="745" y="404" fill="#bc8cff" font-size="9" font-weight="bold">20</text><text x="775" y="404" fill="#f0f6fc" font-size="10">Memory Write Proposal</text><text x="775" y="418" fill="#f85149" font-size="8">★ PII 检查 (AR-008): 敏感→本地, 脱敏→云</text>
<rect x="730" y="440" width="640" height="110" fill="#0d1117" stroke="#bc8cff" stroke-width="1" stroke-dasharray="6,3" rx="4"/>
<text x="1050" y="458" fill="#bc8cff" font-size="11" font-weight="bold" text-anchor="middle">Scheduled / Routine Task Pipeline</text>
<text x="740" y="478" fill="#8b949e" font-size="9">Trigger → Re-evaluate policy → Rebuild context</text>
<text x="740" y="495" fill="#f85149" font-size="9" font-weight="bold">→ Confirm credentials (must be fresh, not days-old)</text>
<text x="740" y="512" fill="#8b949e" font-size="9">→ Run (always enters agent phase)</text>
<text x="740" y="530" fill="#8b949e" font-size="8">不可复用旧 Capability</text>
<rect x="730" y="570" width="640" height="180" fill="#161b22" stroke="#f85149" stroke-width="1" rx="4"/>
<text x="1050" y="590" fill="#f85149" font-size="11" font-weight="bold" text-anchor="middle">v9 核心修正 (vs v8)</text>
<text x="740" y="610" fill="#f85149" font-size="9">1. Policy 在步骤 3(v8 在步骤 7 之后)</text>
<text x="740" y="628" fill="#f85149" font-size="9">2. PEP 每个动作(v8 仅 plan validation)</text>
<text x="740" y="646" fill="#f85149" font-size="9">3. Child Capability 由 Auth Service 签</text>
<text x="740" y="664" fill="#f85149" font-size="9">4. EffectRisk 替代静态 risk tier</text>
<text x="740" y="682" fill="#f85149" font-size="9">5. Re-route = 新 RunPlan revision + 撤旧 Capability</text>
<text x="740" y="700" fill="#f85149" font-size="9">6. 顺序 20 步(v8 并行候选 + Promise.all)</text>
<text x="740" y="718" fill="#f85149" font-size="9">7. Memory Write 带 PII 检查(AR-008)</text>
<rect x="30" y="640" width="640" height="180" fill="#161b22" stroke="#30363d" rx="4"/>
<text x="350" y="660" fill="#8b949e" font-size="11" font-weight="bold" text-anchor="middle">指令优先级 (高→低)</text>
<text x="40" y="680" fill="#f0f6fc" font-size="9">1. Platform policy</text>
<text x="40" y="697" fill="#f0f6fc" font-size="9">2. Organization policy</text>
<text x="40" y="714" fill="#f0f6fc" font-size="9">3. Project policy</text>
<text x="40" y="731" fill="#f0f6fc" font-size="9">4. User instruction</text>
<text x="40" y="748" fill="#f0f6fc" font-size="9">5. Task instruction</text>
<text x="40" y="765" fill="#fbbf24" font-size="9">6. Retrieved content (RAG, web) — untrusted</text>
<text x="40" y="782" fill="#fbbf24" font-size="9">7. Tool output — untrusted</text>
<text x="40" y="805" fill="#f85149" font-size="9" font-weight="bold">低信任不可覆盖高信任</text>
<rect x="30" y="840" width="1340" height="80" fill="#161b22" stroke="#3fb950" stroke-width="1" rx="4"/>
<text x="700" y="860" fill="#3fb950" font-size="11" font-weight="bold" text-anchor="middle">产出反馈: Outcome → Memory Write → User-visible → Evolution Observe → SelfModel</text>
<text x="700" y="880" fill="#8b949e" font-size="9" text-anchor="middle">无独立 Re-router · 需调整时回到步骤 13 生成新 RunPlan revision · Evolution Phase 4+ shadow mode</text>
<text x="700" y="900" fill="#8b949e" font-size="9" text-anchor="middle">5 横切平面: Control(Router+Policy) · Data(Runtime+ToolHost) · Observability(Audit+Trace) · Identity(AuthService) · Budget(BudgetGuard+PEP)</text>
</svg>
