<rect x="1010" y="710" width="10" height="10" fill="#8b949e" rx="2"/>
<text x="1025" y="719" fill="#8b949e" font-size="8">VFS ✗ = non-file tool</text>
<text x="30" y="744" fill="#39c5cf" font-size="9" font-weight="bold">VFS F4 (single file-access authority):</text>
<text x="30" y="760" fill="#8b949e" font-size="9">read_file · list_directory · search_files · write_file · edit_file · create_artifact → thin wrappers over Virtual Filesystem.</text>
<text x="30" y="776" fill="#8b949e" font-size="9">VFS enforces permission rules for both tool calls AND RAG retrieval; OverlayBackend makes edit_file a real per-RunPlan transaction (atomic commit / rollback).</text>
