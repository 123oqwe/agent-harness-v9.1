<text x="730" y="244" fill="#fbbf24" font-size="8" font-weight="bold">run_tests = controlled execute_command profile, NOT a separate tool</text>
<text x="730" y="260" fill="#8b949e" font-size="7">web_fetch: SSRF blocked (CTRL-EGRESS-001); content tagged untrusted, taint [web]</text>
<text x="730" y="274" fill="#8b949e" font-size="7">computer_operate: per-app approval; sentinel apps need escalated consent (FG6)</text>
<text x="730" y="288" fill="#8b949e" font-size="7">browser_operate: drives logged-in sessions; taint [web, screen] (CTRL-SCREEN-ISOLATION-001)</text>
<text x="730" y="302" fill="#8b949e" font-size="7">Transports: native · cli_wrapper · http_api · MCP (JSON-RPC, Phase 2+)</text>
<!-- ============ output_mode ============ -->
<rect x="20" y="320" width="1360" height="62" fill="#0d1117" stroke="#39c5cf" stroke-width="1.5" rx="6"/>
<text x="30" y="338" fill="#39c5cf" font-size="10" font-weight="bold">execute_command_sandboxed output_mode (backpressure — deterministic context-window control)</text>
<text x="30" y="356" fill="#8b949e" font-size="9">full (default): full stdout/stderr   ·   summary: success = exit code + line count only; failure = exit code + stderr + failing assertions   ·   silent: exit code only, never returns output</text>
<text x="30" y="372" fill="#8b949e" font-size="8">Purpose: 200+ lines of passing test output wastes 2-3% of context window; success=minimal output, failure=full diagnostic. Better than letting the model truncate.</text>
<!-- ============ ToolSpec ============ -->
<rect x="20" y="392" width="1360" height="112" fill="#0d1117" stroke="#e3b341" stroke-width="2" rx="6"/>
<text x="30" y="412" fill="#e3b341" font-size="11" font-weight="bold">ToolSpec required fields (v9, expanded from v8 ToolDefinition)</text>
<text x="30" y="430" fill="#8b949e" font-size="9">schemas · effects · risk_feature_extractor · preconditions · postconditions · timeout · cancellation · retry · idempotency · sandbox · network · credentials · data_egress</text>
<text x="30" y="446" fill="#8b949e" font-size="9">receipt · verification · reconciliation · compensation · tests · maturity · certification · run_phase_binding (setup | agent) · egress_policy_ref</text>
<text x="30" y="464" fill="#fbbf24" font-size="9">Only production_certified tools enter the production Registry. Skill can only SUGGEST tool grants — Policy decides.</text>
<text x="30" y="482" fill="#8b949e" font-size="8">SkillSpec (parallel): input/output schema · required context · required tools · allowed effect classes · workflow template · verification template · failure policy · risk ceiling · eval suite</text>
<text x="30" y="498" fill="#8b949e" font-size="8">Two-phase binding (FG2): setup-phase tools (e.g. package_install) vs agent-phase tools; credentials via single-exchange at dispatch (CTRL-CRED-REACH-001), never env across loop</text>
<!-- ============ MCP Allowlist + Generated Tools trust ============ -->
<rect x="20" y="514" width="670" height="158" fill="#0d1117" stroke="#f85149" stroke-width="2" rx="6"/>
<text x="30" y="534" fill="#f85149" font-size="11" font-weight="bold">MCP Allowlist (CTRL-PLUGIN-SIGN-001)</text>
<text x="30" y="552" fill="#8b949e" font-size="9">mcp_allowlist.json lists approved MCP servers by signature:</text>
<text x="30" y="568" fill="#8b949e" font-size="9">  · stdio servers: command hash pin</text>
<text x="30" y="584" fill="#8b949e" font-size="9">  · remote servers: URL + key pin</text>
<text x="30" y="600" fill="#f85149" font-size="9">Unlisted MCP servers → denied. Controls THREAT-TOOL-POISONING.</text>
<text x="30" y="616" fill="#8b949e" font-size="8">Enterprise deployments may use a managed mcp_allowlist.json that</text>
<text x="30" y="630" fill="#8b949e" font-size="8">overrides all other scopes (exclusive scope).</text>
<text x="30" y="650" fill="#8b949e" font-size="8">MCP = 4th transport (JSON-RPC), Phase 2+; joins native/cli_wrapper/http_api.</text>
<rect x="710" y="514" width="670" height="158" fill="#0d1117" stroke="#fbbf24" stroke-width="2" rx="6"/>
<text x="720" y="534" fill="#fbbf24" font-size="11" font-weight="bold">Generated Tools Trust Pipeline (no auto-promote)</text>
<text x="720" y="554" fill="#f85149" font-size="9" font-weight="bold">untrusted</text>
<text x="775" y="554" fill="#8b949e" font-size="8">→ sandbox-only · no secrets · no external write · network denied by default</text>
<text x="720" y="575" fill="#fbbf24" font-size="9" font-weight="bold">verified</text>
<text x="775" y="575" fill="#8b949e" font-size="8">→ 10+ uses, 80% success</text>
<text x="720" y="596" fill="#3fb950" font-size="9" font-weight="bold">trusted</text>
<text x="775" y="596" fill="#8b949e" font-size="8">→ 50+ uses, 90% success, human review</text>
<text x="720" y="617" fill="#58a6ff" font-size="9" font-weight="bold">builtin</text>
<text x="775" y="617" fill="#8b949e" font-size="8">→ manual publication only</text>
<text x="720" y="640" fill="#f85149" font-size="9">★ Success count does NOT auto-promote. Agent should NOT auto-promote.</text>
<text x="720" y="658" fill="#8b949e" font-size="8">Success count ≠ trust. Manual review required at every promotion gate.</text>
