<?xml version="1.0" encoding="UTF-8"?>
<!-- Hook Architecture (v9) — Loop Engine injection points + re-validation -->
<svg width="1400" height="560" viewBox="0 0 1400 560" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="ar" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#8b949e"/></marker>
<marker id="ag" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#3fb950"/></marker>
<marker id="ared" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#f85149"/></marker>
</defs>
<rect x="0" y="0" width="1400" height="560" fill="#0d1117" rx="8"/>
<text x="20" y="28" fill="#fbcfe8" font-size="15" font-weight="bold">Hook Architecture — Loop Engine 注入点 (v9)</text>
<text x="20" y="46" fill="#8b949e" font-size="11">runtime-core.md AR-007: Hook 输出必须 re-validate Schema + Policy · hook-injection.test.ts 验证 · Hook ≠ Steering</text>

<!-- Loop Engine cycle -->
<rect x="40" y="80" width="1320" height="180" fill="#161b22" stroke="#3fb950" stroke-width="2" rx="6"/>
<text x="700" y="100" fill="#3fb950" font-size="12" font-weight="bold" text-anchor="middle">Loop Engine 一轮执行</text>

<rect x="60" y="120" width="140" height="50" fill="#21262d" stroke="#fbbf24" stroke-width="2" rx="4"/>
<text x="130" y="140" fill="#fbbf24" font-size="9" font-weight="bold" text-anchor="middle">pre_turn_hook</text>
<text x="130" y="155" fill="#8b949e" font-size="8" text-anchor="middle">turn 开始前</text>
<line x1="200" y1="145" x2="240" y2="145" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="240" y="120" width="140" height="50" fill="#21262d" stroke="#3fb950" stroke-width="1" rx="4"/>
<text x="310" y="140" fill="#3fb950" font-size="9" font-weight="bold" text-anchor="middle">model call</text>
<text x="310" y="155" fill="#8b949e" font-size="8" text-anchor="middle">LLM 推理</text>
<line x1="380" y1="145" x2="420" y2="145" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="420" y="120" width="140" height="50" fill="#21262d" stroke="#fbbf24" stroke-width="2" rx="4"/>
<text x="490" y="140" fill="#fbbf24" font-size="9" font-weight="bold" text-anchor="middle">pre_tool_hook</text>
<text x="490" y="155" fill="#8b949e" font-size="8" text-anchor="middle">工具执行前</text>
<line x1="560" y1="145" x2="600" y2="145" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="600" y="120" width="140" height="50" fill="#21262d" stroke="#e3b341" stroke-width="1" rx="4"/>
<text x="670" y="140" fill="#e3b341" font-size="9" font-weight="bold" text-anchor="middle">tool exec</text>
<text x="670" y="155" fill="#8b949e" font-size="8" text-anchor="middle">12步 pipeline</text>
<line x1="740" y1="145" x2="780" y2="145" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="780" y="120" width="140" height="50" fill="#21262d" stroke="#fbbf24" stroke-width="2" rx="4"/>
<text x="850" y="140" fill="#fbbf24" font-size="9" font-weight="bold" text-anchor="middle">post_tool_hook</text>
<text x="850" y="155" fill="#8b949e" font-size="8" text-anchor="middle">工具执行后</text>
<line x1="920" y1="145" x2="960" y2="145" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="960" y="120" width="140" height="50" fill="#21262d" stroke="#fbbf24" stroke-width="2" rx="4"/>
<text x="1030" y="140" fill="#fbbf24" font-size="9" font-weight="bold" text-anchor="middle">post_turn_hook</text>
<text x="1030" y="155" fill="#8b949e" font-size="8" text-anchor="middle">turn 结束后</text>
<line x1="1100" y1="145" x2="1140" y2="145" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="1140" y="120" width="200" height="50" fill="#21262d" stroke="#8b949e" stroke-width="1" rx="4"/>
<text x="1240" y="140" fill="#8b949e" font-size="9" font-weight="bold" text-anchor="middle">下一轮 / 停止条件检查</text>
<text x="1240" y="155" fill="#8b949e" font-size="8" text-anchor="middle">9 个停止条件</text>

<!-- Re-validation path -->
<line x1="490" y1="170" x2="490" y2="230" stroke="#f85149" stroke-width="1.5" marker-end="url(#ared)"/>
<line x1="850" y1="170" x2="850" y2="230" stroke="#f85149" stroke-width="1.5" marker-end="url(#ared)"/>
<rect x="300" y="230" width="740" height="50" fill="#1a0808" stroke="#f85149" stroke-width="2" rx="4"/>
<text x="670" y="250" fill="#f85149" font-size="11" font-weight="bold" text-anchor="middle">Hook 输出 → Schema + Policy re-validation (AR-007)</text>
<text x="670" y="267" fill="#8b949e" font-size="9" text-anchor="middle">不通过 → 丢弃 + 安全告警 · tests/security/hook-injection.test.ts 验证 compromised hook 不能注入恶意参数</text>

<!-- Hook vs Steering -->
<rect x="40" y="320" width="640" height="220" fill="#161b22" stroke="#30363d" rx="6"/>
<text x="360" y="340" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">Hook (系统/插件注入)</text>
<text x="60" y="365" fill="#f0f6fc" font-size="9">来源: 系统插件, MCP, skill chaining</text>
<text x="60" y="385" fill="#8b949e" font-size="9">pre_turn: 修改 context, 注入 reminder</text>
<text x="60" y="405" fill="#8b949e" font-size="9">pre_tool: 拦截/修改 tool call 参数</text>
<text x="60" y="425" fill="#8b949e" font-size="9">post_tool: 后处理 tool result</text>
<text x="60" y="445" fill="#8b949e" font-size="9">post_turn: 记录, 触发 follow-up</text>
<text x="60" y="470" fill="#f85149" font-size="9" font-weight="bold">约束: 输出必须 re-validate</text>
<text x="60" y="485" fill="#8b949e" font-size="9">不可绕过 Policy/PEP</text>
<text x="60" y="500" fill="#8b949e" font-size="9">不可自授予权限</text>
<text x="60" y="520" fill="#8b949e" font-size="9">Phase 2 实现</text>

<rect x="720" y="320" width="640" height="220" fill="#161b22" stroke="#30363d" rx="6"/>
<text x="1040" y="340" fill="#bc8cff" font-size="12" font-weight="bold" text-anchor="middle">Steering (用户注入)</text>
<text x="740" y="365" fill="#f0f6fc" font-size="9">来源: 用户输入 (POST /runs/{runId}/steer)</text>
<text x="740" y="385" fill="#8b949e" font-size="9">steerQueue: 当前 turn 内</text>
<text x="740" y="405" fill="#8b949e" font-size="9">followUpQueue: 当前 turn 后</text>
<text x="740" y="425" fill="#8b949e" font-size="9">nextTurnQueue: 下一 turn</text>
<text x="740" y="445" fill="#8b949e" font-size="9">优先级: Kill > Security > Cancel > ...</text>
<text x="740" y="470" fill="#bc8cff" font-size="9" font-weight="bold">区别: 用户意图, 非 system</text>
<text x="740" y="485" fill="#8b949e" font-size="9">不经 re-validation (用户是 trusted)</text>
<text x="740" y="500" fill="#8b949e" font-size="9">但受 Policy 约束</text>
<text x="740" y="520" fill="#8b949e" font-size="9">Phase 1 实现 (chat.yaml steer endpoint)</text>
</svg>
