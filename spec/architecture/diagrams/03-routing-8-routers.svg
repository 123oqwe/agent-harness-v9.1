<?xml version="1.0" encoding="UTF-8"?>
<!-- Routing & Orchestration System — 8 Routers + Global Optimizer + Re-router -->
<svg width="1400" height="750" viewBox="0 0 1400 750" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="ar" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#8b949e"/></marker>
<marker id="ab" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#58a6ff"/></marker>
<marker id="ag" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#3fb950"/></marker>
</defs>
<rect x="0" y="0" width="1400" height="750" fill="#0d1117" rx="8"/><text x="20" y="28" fill="#fbcfe8" font-size="15" font-weight="bold">Routing & Orchestration System — 8 Routers + Global Optimizer + Re-router (v8)</text>
<text x="20" y="46" fill="#8b949e" font-size="11">3层实现: 确定性 preflight → 1次 Task Profiler LLM → 确定性 candidate optimizer · 不靠 10+ 次 LLM</text>
<rect x="400" y="60" width="600" height="40" fill="#161b22" stroke="#6b7280" stroke-width="2" rx="6"/>
<text x="410" y="78" fill="#6b7280" font-size="11" font-weight="bold">Layer 1: Fast Preflight (纯代码, 0 LLM)</text>
<text x="410" y="94" fill="#8b949e" font-size="10">文件类型 · 模态 · 权限 · Provider健康 · Context大小 · 外部动作 · 敏感数据 · 预算</text>
<rect x="400" y="110" width="600" height="45" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
<text x="410" y="128" fill="#58a6ff" font-size="11" font-weight="bold">Layer 2: Task Profiler (1 LLM call, 便宜快速模型)</text>
<text x="410" y="144" fill="#8b949e" font-size="10">Intent · Domain · Modality · Complexity · Ambiguity · Risk · likely_tools · confidence</text>
<line x1="700" y1="100" x2="700" y2="110" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="100" y="175" fill="#fbcfe8" font-size="12" font-weight="bold">Layer 3: Parallel Candidate Resolution (确定性, Registry查询+评分, 0 LLM)</text>
<rect x="20" y="190" width="440" height="45" fill="#21262d" stroke="#3fb950" stroke-width="2" rx="6"/>
<text x="30" y="208" fill="#3fb950" font-size="10" font-weight="bold">Strategy Router</text>
<text x="30" y="224" fill="#8b949e" font-size="9">Direct · ReAct · PlanExecute · ReWOO · IterativeRefine · Deterministic</text>
<rect x="20" y="250" width="440" height="65" fill="#21262d" stroke="#58a6ff" stroke-width="2" rx="6"/>
<text x="30" y="268" fill="#58a6ff" font-size="10" font-weight="bold">Agent Topology Router</text>
<text x="30" y="284" fill="#8b949e" font-size="9">Single · Supervisor · Planner-Verifier · Parallel · Peer · Swarm</text>
<text x="30" y="298" fill="#8b949e" font-size="8">MultiAgentUtility = parallelism + specialization + context_relief + verification - coordination - cost - risk</text>
<rect x="20" y="325" width="440" height="65" fill="#21262d" stroke="#bc8cff" stroke-width="2" rx="6"/>
<text x="30" y="343" fill="#bc8cff" font-size="10" font-weight="bold">Context Topology Router v8</text>
<text x="30" y="359" fill="#8b949e" font-size="9">Shared · Selective · Parent-Child · Isolated · Artifact · Blackboard · Blind</text>
<text x="30" y="373" fill="#8b949e" font-size="8">默认: shared_selective + isolation + artifact handoff</text>
<rect x="490" y="190" width="440" height="45" fill="#21262d" stroke="#fbbf24" stroke-width="2" rx="6"/>
<text x="500" y="208" fill="#fbbf24" font-size="10" font-weight="bold">Model/API Router v8</text>
<text x="500" y="224" fill="#8b949e" font-size="9">Capability Registry → modality match → privacy match → cost/latency optimize</text>
<text x="500" y="238" fill="#8b949e" font-size="8">多模型工作流: doc_model → reasoning → image_gen → vision_verify</text>
<rect x="490" y="270" width="440" height="50" fill="#21262d" stroke="#e3b341" stroke-width="2" rx="6"/>
<text x="500" y="288" fill="#e3b341" font-size="10" font-weight="bold">Tool Router</text>
<text x="500" y="304" fill="#8b949e" font-size="9">20+ tools, 按 task_profile.likely_tools + domain 匹配</text>
<text x="500" y="318" fill="#8b949e" font-size="8">区分 Model API (推理) vs Action Tool (改变现实)</text>
<rect x="490" y="330" width="440" height="45" fill="#21262d" stroke="#f778ba" stroke-width="2" rx="6"/>
<text x="500" y="348" fill="#f778ba" font-size="10" font-weight="bold">Skill Router</text>
<text x="500" y="364" fill="#8b949e" font-size="9">10+ skills, 按 trigger + domain + intent 匹配</text>
<text x="500" y="378" fill="#8b949e" font-size="8">source: builtin | evolved | user_created</text>
<rect x="960" y="190" width="440" height="45" fill="#21262d" stroke="#39c5cf" stroke-width="2" rx="6"/>
<text x="970" y="208" fill="#39c5cf" font-size="10" font-weight="bold">Execution Env Router</text>
<text x="970" y="224" fill="#8b949e" font-size="9">Host · Sandbox · Container · MicroVM · Browser · Remote</text>
<rect x="960" y="250" width="440" height="65" fill="#21262d" stroke="#3fb950" stroke-width="2" rx="6"/>
<text x="970" y="268" fill="#3fb950" font-size="10" font-weight="bold">Verification Router</text>
<text x="970" y="284" fill="#8b949e" font-size="9">Deterministic · Blind · Independent Verifier</text>
<text x="970" y="298" fill="#8b949e" font-size="8">independent_verification_needed → blind_verification</text>
<rect x="400" y="410" width="600" height="55" fill="#1a0808" stroke="#f85149" stroke-width="2" rx="6"/>
<text x="410" y="428" fill="#f85149" font-size="11" font-weight="bold">Global Route Optimizer</text>
<text x="410" y="444" fill="#8b949e" font-size="10">RouteScore = success_prob + quality - cost - latency - risk - context_pressure - coordination</text>
<text x="410" y="458" fill="#8b949e" font-size="9">联合评分 → 选最优候选组合 → Policy Validator → RunConfiguration</text>
<line x1="240" y1="380" x2="700" y2="410" stroke="#8b949e" stroke-width="1" marker-end="url(#ab)"/>
<line x1="710" y1="380" x2="700" y2="410" stroke="#8b949e" stroke-width="1" marker-end="url(#ab)"/>
<line x1="1180" y1="380" x2="700" y2="410" stroke="#8b949e" stroke-width="1" marker-end="url(#ab)"/>
<rect x="300" y="480" width="800" height="60" fill="#1a0808" stroke="#fbcfe8" stroke-width="2" rx="6"/>
<text x="310" y="498" fill="#fbcfe8" font-size="11" font-weight="bold">RunConfiguration</text>
<text x="310" y="514" fill="#8b949e" font-size="10">reasoning_strategy + workflow_patterns + agent_topology + context_topology</text>
<text x="310" y="528" fill="#8b949e" font-size="9">primary_model + fallback_models + selected_tools + selected_skills + execution_environment</text>
<text x="310" y="542" fill="#8b949e" font-size="9">budget_policy + risk_policy + consent_policy + verification_policy + fallback_policy + limits + routing_evidence</text>
<line x1="700" y1="465" x2="700" y2="480" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="400" y="555" width="600" height="35" fill="#161b22" stroke="#3fb950" stroke-width="2" rx="6"/>
<text x="410" y="573" fill="#3fb950" font-size="11" font-weight="bold">Agent Runtime Core 执行</text>
<line x1="700" y1="540" x2="700" y2="555" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="100" y="605" width="1200" height="50" fill="#1a1208" stroke="#fbbf24" stroke-width="2" rx="6"/>
<text x="110" y="623" fill="#fbbf24" font-size="11" font-weight="bold">Runtime Re-router (局部重新路由, 不重新造 Harness)</text>
<text x="110" y="639" fill="#8b949e" font-size="10">Strategy fail → Strategy Router · Model unavailable → Model Router · Complexity increase → Topology upgrade</text>
<text x="110" y="653" fill="#8b949e" font-size="9">Context overflow → Context Router compress/isolate · Budget low → Budget degradation · Verify fail → Verification escalate</text>
<line x1="700" y1="590" x2="700" y2="605" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 200 605 Q 100 400 200 215" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ar)"/>
<path d="M 600 605 Q 500 400 600 215" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ar)"/>
<text x="150" y="400" fill="#fbbf24" font-size="9">re-route</text>
<text x="550" y="400" fill="#fbbf24" font-size="9">re-route</text>
<rect x="100" y="670" width="1200" height="40" fill="#1a0808" stroke="#f85149" stroke-width="2" rx="6"/>
<text x="110" y="688" fill="#f85149" font-size="11" font-weight="bold">安全不变量</text>
<text x="110" y="704" fill="#8b949e" font-size="10">Re-route 不能跳过 Policy/PEP · 升级深度限制(2次) · cooldown(5min) · 不能 fallback 回 primary · BudgetGuard 在 PEP 硬执行</text>
<text x="20" y="730" fill="#f85149" font-size="10">THREAT-ROUTING-MISCLASSIFY · THREAT-RE-ROUTE-LOOP · THREAT-SWARM-ACTION · THREAT-CONTEXT-LEAK · THREAT-BUDGET-BYPASS · THREAT-FALLBACK-LOOP</text>
</svg>
