<?xml version="1.0" encoding="UTF-8"?>
<!-- Context Topologies — 7 Types (Shared Full/Selective/Parent-Child/Isolated/Artifact/Blackboard/Blind) -->
<svg width="1400" height="650" viewBox="0 0 1400 650" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="ar" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#8b949e"/></marker>
<marker id="ab" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#58a6ff"/></marker>
<marker id="ag" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#3fb950"/></marker>
</defs>
<rect x="0" y="0" width="1400" height="650" fill="#0d1117" rx="8"/><text x="20" y="28" fill="#bc8cff" font-size="15" font-weight="bold">Context Topologies — 7 Types (v8 NEW)</text>
<text x="20" y="46" fill="#8b949e" font-size="11">多 Agent 上下文如何共享/隔离 · 必须有独立 Router · 默认: shared_selective + isolation + artifact handoff</text>
<rect x="20" y="65" width="660" height="75" fill="#161b22" stroke="#f85149" stroke-width="2" rx="6"/>
<text x="30" y="83" fill="#f85149" font-size="11" font-weight="bold">Shared Full</text>
<text x="30" y="99" fill="#8b949e" font-size="10">所有Agent看到相同上下文</text>
<text x="30" y="113" fill="#8b949e" font-size="9">上下文小·Agent少·高度协作</text>
<text x="30" y="127" fill="#8b949e" font-size="9">Token重复·污染传播·相同偏差·难独立验证</text>
<text x="30" y="141" fill="#8b949e" font-size="9">⚠ 不应默认使用</text>
<rect x="20" y="150" width="660" height="75" fill="#161b22" stroke="#3fb950" stroke-width="2" rx="6"/>
<text x="30" y="168" fill="#3fb950" font-size="11" font-weight="bold">Shared Selective ★默认</text>
<text x="30" y="184" fill="#8b949e" font-size="10">共同目标+约束+计划+必要背景 + 各自专属上下文</text>
<text x="30" y="198" fill="#8b949e" font-size="9">大多数多Agent场景</text>
<text x="30" y="212" fill="#8b949e" font-size="9">需要设计共享边界</text>
<text x="30" y="226" fill="#8b949e" font-size="9">Worker A: 后端 · Worker B: 前端 · Reviewer: diff+测试</text>
<rect x="20" y="235" width="660" height="75" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
<text x="30" y="253" fill="#58a6ff" font-size="11" font-weight="bold">Parent-Child</text>
<text x="30" y="269" fill="#8b949e" font-size="10">Supervisor完整上下文 · 子Agent只获子任务+证据+工具+格式+预算+停止条件</text>
<text x="30" y="283" fill="#8b949e" font-size="9">Planner→Workers · 大型项目分工</text>
<text x="30" y="297" fill="#8b949e" font-size="9">子Agent缺乏全局视角</text>
<text x="30" y="311" fill="#8b949e" font-size="9">完成后返回结构化Artifact</text>
<rect x="20" y="320" width="660" height="75" fill="#161b22" stroke="#bc8cff" stroke-width="2" rx="6"/>
<text x="30" y="338" fill="#bc8cff" font-size="11" font-weight="bold">Isolated</text>
<text x="30" y="354" fill="#8b949e" font-size="10">每个Agent完全隔离</text>
<text x="30" y="368" fill="#8b949e" font-size="9">独立解题·安全审查·独立验证·多模型对比·红蓝队</text>
<text x="30" y="382" fill="#8b949e" font-size="9">无协作·重复工作</text>
<text x="30" y="396" fill="#8b949e" font-size="9">完全隔离</text>
<rect x="720" y="65" width="660" height="75" fill="#161b22" stroke="#e3b341" stroke-width="2" rx="6"/>
<text x="730" y="83" fill="#e3b341" font-size="11" font-weight="bold">Artifact-Only</text>
<text x="730" y="99" fill="#8b949e" font-size="10">不共享对话·只通过结构化文件传递</text>
<text x="730" y="113" fill="#8b949e" font-size="9">编码和长期任务(可追踪/可重放/可断点/不污染)</text>
<text x="730" y="127" fill="#8b949e" font-size="9">需要Artifact schema</text>
<text x="730" y="141" fill="#8b949e" font-size="9">JSON·Patch·EvidenceBundle·TestReport·PlanArtifact</text>
<rect x="720" y="150" width="660" height="75" fill="#161b22" stroke="#f778ba" stroke-width="2" rx="6"/>
<text x="730" y="168" fill="#f778ba" font-size="11" font-weight="bold">Shared Blackboard</text>
<text x="730" y="184" fill="#8b949e" font-size="10">受控共享区: TaskBoard·Evidence·Questions·Artifacts·Conflicts·Decisions</text>
<text x="730" y="198" fill="#8b949e" font-size="9">研究和Swarm</text>
<text x="730" y="212" fill="#8b949e" font-size="9">必须append-only/版本化·有作者/来源/权限·检测冲突</text>
<text x="730" y="226" fill="#8b949e" font-size="9">普通Worker不能修改最终决策</text>
<rect x="720" y="235" width="660" height="75" fill="#161b22" stroke="#39c5cf" stroke-width="2" rx="6"/>
<text x="730" y="253" fill="#39c5cf" font-size="11" font-weight="bold">Blind Verification</text>
<text x="730" y="269" fill="#8b949e" font-size="10">Verifier不看生成Agent的推理·只看要求+产物+证据+测试+success_criteria</text>
<text x="730" y="283" fill="#8b949e" font-size="9">需要真正独立的检查</text>
<text x="730" y="297" fill="#8b949e" font-size="9">Verifier可能缺上下文</text>
<text x="730" y="311" fill="#8b949e" font-size="9">→ 独立验证</text>
<rect x="720" y="325" width="660" height="55" fill="#081a08" stroke="#3fb950" stroke-width="2" rx="6"/>
<text x="730" y="343" fill="#3fb950" font-size="11" font-weight="bold">默认值 (v8)</text>
<text x="730" y="359" fill="#8b949e" font-size="10">多Agent默认: Context Isolation + Selective Shared Context + Artifact Handoff</text>
<text x="730" y="373" fill="#8b949e" font-size="9">不是所有Agent共享完整对话</text>
<rect x="20" y="420" width="1360" height="50" fill="#1a0808" stroke="#bc8cff" stroke-width="2" rx="6"/>
<text x="30" y="438" fill="#bc8cff" font-size="11" font-weight="bold">Context Topology Router</text>
<text x="30" y="454" fill="#8b949e" font-size="10">输入: TaskProfile(agent_topology, context_pressure, sensitivity, verification_needed) → 输出: context_topology</text>
<text x="30" y="468" fill="#8b949e" font-size="9">规则: single_agent→N/A · supervisor_workers→parent_child · swarm→shared_blackboard · verifier→blind_verification</text>
<rect x="20" y="485" width="1360" height="45" fill="#1a0808" stroke="#f85149" stroke-width="2" rx="6"/>
<text x="30" y="503" fill="#f85149" font-size="11" font-weight="bold">Threats</text>
<text x="30" y="519" fill="#8b949e" font-size="10">THREAT-CONTEXT-LEAK: 配置错误导致泄漏 → 默认isolation · THREAT-MULTI-AGENT-ESCAPE: 共享上下文逃逸 → capability attenuation + context isolation</text>
<rect x="20" y="545" width="1360" height="75" fill="#0d1117" stroke="#161b22" stroke-width="2" rx="6"/>
<text x="30" y="563" fill="#161b22" font-size="11" font-weight="bold">Artifact Handoff (推荐的多Agent数据传递方式)</text>
<text x="30" y="579" fill="#8b949e" font-size="10">Agent不共享对话·只通过结构化Artifact传递: JSON · Patch · EvidenceBundle · TestReport · PlanArtifact · DecisionRecord</text>
<text x="30" y="593" fill="#8b949e" font-size="9">优点: 可追踪 · 可重放 · 可断点恢复 · 不污染上下文 · 可验证</text>
<text x="30" y="607" fill="#8b949e" font-size="9">与 Parent-Child / Isolated / Blind Verification 配合使用</text>
</svg>
