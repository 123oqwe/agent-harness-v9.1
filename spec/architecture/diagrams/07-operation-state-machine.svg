<text x="590" y="279" fill="#8b949e" font-size="10">RE_ROUTE: '调整执行方式...' · BUDGET_LOW: '⚠ 预算不足, 降级执行'</text>
<text x="590" y="293" fill="#8b949e" font-size="9">用户可见状态, 内部状态机 v6.1 不变</text>
<rect x="20" y="310" width="1260" height="110" fill="#0d1117" stroke="#3fb950" stroke-width="2" rx="6"/>
<text x="30" y="328" fill="#3fb950" font-size="11" font-weight="bold">Invariants (property tests)</text>
<text x="30" y="344" fill="#8b949e" font-size="10">1.未授权不能执行 2.同一operation不会两次不可逆 3.过期fencing不能提交 4.terminal不可回执行 5.CONSENT_EXEMPT存在</text>
<text x="30" y="358" fill="#8b949e" font-size="9">6.只有PRE_DISPATCH_FAILED可automatic retry 7.EFFECT_UNKNOWN必须先read-back</text>
<text x="30" y="372" fill="#8b949e" font-size="9">恢复三分类: Revert(本地) · Compensate(新动作抵消) · Remediate(人工)</text>
