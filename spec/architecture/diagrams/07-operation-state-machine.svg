<text x="20" y="555" fill="#8b949e" font-size="10">Receipt 3级: PROVIDER_ACCEPTED(queued) → EFFECT_OBSERVED(未独立验证) → EFFECT_VERIFIED(独立read-back) → EFFECT_CONFIRMED</text>
<text x="20" y="575" fill="#8b949e" font-size="10">Retry: 每次生成新attempt_id和新CapabilityToken · 旧token已used/expired · 不能复用</text>
