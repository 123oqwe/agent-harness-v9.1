<text x="30" y="598" fill="#3fb950" font-size="11" font-weight="bold">Invariants (property tests · operation.machine.json)</text>
<text x="30" y="616" fill="#8b949e" font-size="10">1. Only PRE_DISPATCH_FAILED can automatic retry   ·   2. EFFECT_UNKNOWN must read-back (RECONCILING) before retry   ·   3. Expired fencing cannot commit (EXPIRED terminal)</text>
<text x="30" y="634" fill="#8b949e" font-size="10">4. No double irreversible effect (same operation cannot commit twice)   ·   5. No unauthorized execution (POLICY_EVALUATED → AUTHORIZED)   ·   6. Terminal states not re-enterable</text>
<text x="30" y="652" fill="#fbbf24" font-size="10">Controls: CTRL-REVALIDATE-001 (per-action re-validation at dispatch) · CTRL-CAPABILITY-SINGLE-USE-001 (capability token single-use; each retry = new attempt_id + new CapabilityToken)</text>
<text x="30" y="670" fill="#8b949e" font-size="9">Recovery three classes: Revert (local/overlay) · Compensate (new action offsets) · Remediate (human) — see failure-recovery.md + diagram 12</text>
<text x="30" y="686" fill="#8b949e" font-size="9">Receipt levels: PROVIDER_ACCEPTED (queued) → EFFECT_OBSERVED (observed) → EFFECT_VERIFIED (independent read-back) → EFFECT_CONFIRMED (terminal success)</text>
<rect x="20" y="700" width="1480" height="60" fill="#0d1117" stroke="#30363d" stroke-width="1" rx="6"/>
