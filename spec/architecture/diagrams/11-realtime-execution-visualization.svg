<!-- Backpressure -->
<rect x="40" y="250" width="780" height="100" fill="#161b22" stroke="#fbbf24" stroke-width="1" rx="6"/>
<text x="430" y="270" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">背压策略</text>
<text x="50" y="290" fill="#f0f6fc" font-size="9">1. output_mode 透传: success=最小输出, failure=完整诊断</text>
<text x="50" y="305" fill="#8b949e" font-size="9">2. 事件批合并: command_output 50ms 间隔 (10000行→200事件)</text>
<text x="50" y="320" fill="#8b949e" font-size="9">3. F10 offload: tool结果&gt;20000token → VFS, UI收指针+10行预览</text>
<text x="50" y="335" fill="#8b949e" font-size="9">4. context_reset: UI 收 handoff 事件, 渲染"session已交接"</text>

