asyncapi: 2.6.0
info:
  title: Agent Harness Event Stream
  version: 9.2.0
  description: Real-time event streaming for Agent Harness
servers:
  production:
    url: api.agent-harness.dev
    protocol: wss
  staging:
    url: staging-api.agent-harness.dev
    protocol: wss
  local:
    url: localhost:3000
    protocol: ws

channels:
  runs/{runId}/events:
    description: Run event stream
    parameters:
      runId:
        schema:
          type: string
          format: uuid
    subscribe:
      message:
        contentType: application/json
        schema:
          type: object
          required: [event_id, sequence, run_id, type, timestamp, payload, redaction_applied]
          properties:
            event_id:
              type: string
            sequence:
              type: integer
            run_id:
              type: string
            agent_id:
              type: string
            step_id:
              type: string
            type:
              type: string
              enum: [run_started, step_started, tool_called, tool_result, model_response, verification_result, state_changed, budget_update, error, run_completed, run_failed, re_route, pause, resume, cancel]
            timestamp:
              type: string
              format: date-time
            payload:
              type: object
            redaction_applied:
              type: boolean

  runs/{runId}/steering:
    description: Steering commands for a run
    parameters:
      runId:
        schema:
          type: string
    publish:
      message:
        contentType: application/json
        schema:
          type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [steer, follow_up, next_turn, cancel, kill]
            content:
              type: string

  missions/{missionId}/updates:
    description: Mission update stream
    parameters:
      missionId:
        schema:
          type: string
    subscribe:
      message:
        schema:
          type: object
          properties:
            type:
              type: string
              enum: [phase_changed, step_completed, decision_gate, mission_completed, mission_failed]
            phase:
              type: string
            details:
              type: object

  approvals/requests:
    description: Approval request notifications
    subscribe:
      message:
        schema:
          type: object
          properties:
            approval_id:
              type: string
            manifest_hash:
              type: string
            risk_tier:
              type: integer
            preview:
              type: object
            expires_at:
              type: string

  tools/status:
    description: Tool execution status
    subscribe:
      message:
        schema:
          type: object
          properties:
            tool_name:
              type: string
            operation_id:
              type: string
            status:
              type: string
              enum: [dispatched, in_flight, provider_accepted, effect_observed, effect_verified, effect_confirmed, effect_unknown, failed]
            receipt:
              type: object

  verification/results:
    description: Verification result events
    subscribe:
      message:
        schema:
          type: object
          properties:
            verification_id:
              type: string
            requirement_id:
              type: string
            result:
              type: string
              enum: [pass, fail]
            evidence_ref:
              type: string
            verifier_model:
              type: string

  reconciliation/results:
    description: Reconciliation result events
    subscribe:
      message:
        schema:
          type: object
          properties:
            operation_id:
              type: string
            result:
              type: string
              enum: [confirmed, unknown, remediation_required]
            details:
              type: object

  notifications/user:
    description: User notification events
    subscribe:
      message:
        schema:
          type: object
          properties:
            notification_id:
              type: string
            type:
              type: string
              enum: [task_completed, approval_required, budget_warning, re_route, evolution_suggestion, error, daily_brief, open_loop_reminder]
            title:
              type: string
            body:
              type: string
            priority:
              type: string
              enum: [low, medium, high, urgent]

  admin/security:
    description: Admin security events
    subscribe:
      message:
        schema:
          type: object
          properties:
            event_type:
              type: string
              enum: [unauthorized_access, capability_replay, budget_bypass, tenant_leak, plugin_signature_invalid, kill_switch_activated]
            severity:
              type: string
              enum: [warning, critical]
            details:
              type: object

  deployment/events:
    description: Deployment lifecycle events
    subscribe:
      message:
        schema:
          type: object
          properties:
            type:
              type: string
              enum: [deploy_started, deploy_completed, canary_started, canary_slo_met, canary_rollback, production_cutover, rollback_initiated]
            environment:
              type: string
            version:
              type: string
            details:
              type: object
