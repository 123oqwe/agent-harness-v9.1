name: Phase 1 Mutation Full Run

# Full Phase 1 mutation run on a self-hosted macOS runner.
#
# Why not GitHub-hosted: jobs are hard-capped at 360min, but the Phase 1 suite
# measures ~15h (14 modules ~6.2h sequential + gateway 43 chunks ~8.7h;
# run-mutation.mjs runs modules/chunks sequentially, Stryker concurrency is
# capped at 2). A self-hosted runner has no per-job timeout cap, so this
# workflow runs the whole suite in one job at the exact commit under test.
#
# Evidence pipeline (all in this job):
#   checkout -> npm ci -> build -> REBIND waivers (commitSha=$GITHUB_SHA and the
#   configuration hash computed from this checkout; run-mutation.mjs permits
#   exactly this one dirty file) -> full suite -> aggregate -> threshold check
#   -> upload reports/mutation/ as an artifact. ENOBUFS is fixed upstream by
#   secure-release-io.mjs maxBuffer=512MiB (232MiB tree ~= 330MiB base64).
#
# Trigger: workflow_dispatch only in practice. The push+paths filter fires once
# when this workflow file itself is committed; code pushes (task 4+) never
# re-trigger the ~15h suite.

on:
  workflow_dispatch:
  push:
    branches: [codex/phase2-integrated]
    paths:
      - '.github/workflows/phase1-mutation-full.yml'

permissions:
  contents: read

concurrency:
  group: phase1-mutation-full
  cancel-in-progress: false

jobs:
  mutation:
    runs-on: mac-mutation
    timeout-minutes: 1200
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # build:root compiles root TS that imports @agent-harness/* workspace
      # packages, whose dist/ must exist first. build:workspaces must run before
      # `npm run build` (mirrors ci.yml's step order).
      - name: Build workspaces then root
        run: |
          npm run build:workspaces --silent
          npm run build --silent
      - name: Rebind mutation waivers to the verified commit
        env:
          VERIFY_COMMIT_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { computeMutationConfigurationHash } from './scripts/run-mutation.mjs';
          const commitSha = process.env.VERIFY_COMMIT_SHA;
          const configurationHash = computeMutationConfigurationHash();
          const path = './mutation/equivalent-mutants.json';
          const waivers = JSON.parse(readFileSync(path, 'utf8'));
          for (const w of waivers) {
            w.commitSha = commitSha;
            w.configurationHash = configurationHash;
          }
          writeFileSync(path, JSON.stringify(waivers, null, 2) + '\n');
          console.log(`rebound ${waivers.length} waivers -> ${commitSha} ${configurationHash}`);
          NODE
      - name: Run Phase 1 mutation suite
        run: npm run test:mutation:phase1
        timeout-minutes: 1080
      - name: Build Phase 1 aggregate report
        run: node scripts/generate-phase1-aggregate.mjs
      - name: Verify Phase 1 mutation thresholds
        env:
          EXPECTED_SHA: ${{ github.sha }}
          MUTATION_ARTIFACT_NAME: phase1-mutation-${{ github.sha }}
        run: |
          DIGEST="$(shasum -a 256 reports/mutation/phase1/mutation.json | cut -d' ' -f1)"
          echo "artifact_digest=$DIGEST"
          MUTATION_ARTIFACT_DIGEST="$DIGEST" node scripts/check-mutation-thresholds.mjs phase1
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase1-mutation-${{ github.sha }}
          path: reports/mutation/
          if-no-files-found: error
