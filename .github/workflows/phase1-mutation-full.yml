name: Phase 1 Mutation Full Run

# Full Phase 1 mutation run on a self-hosted macOS runner, split into two
# independent mutation jobs plus a verify job.
#
# Why split: a single monolithic job kept hitting the 1080-min step timeout —
# gateway alone measures ~12.4h and rest (the other 14 modules) ~9-10h, sum
# ~22h. Split into `gateway-mutation` (17 files) and `rest-mutation` (the
# remaining 14 modules) so each fits its step budget, and so a failing half
# can be re-run alone.
#
# Runner note: the machine registers ONE self-hosted runner instance
# (`mac-phase1-runner`), so the two jobs execute sequentially there. The jobs
# hold DISJOINT run locks (`.phase1.lock.gateway` / `.phase1.lock.rest`), so
# registering a second runner instance is enough to make them truly parallel
# (~10-11h wall clock) without any pipeline change.
#
# Evidence pipeline:
#   gateway-mutation: checkout -> npm ci -> build -> rebind waivers -> run
#     `phase1:gateway` (its own run dir R1) -> upload reports/mutation/ as
#     phase1-mutation-gateway-{sha}.
#   rest-mutation:    same but `phase1:rest` (run dir R2) -> upload as
#     phase1-mutation-rest-{sha}.
#   verify:           needs both. Downloads both artifacts into one
#     reports/mutation/ tree, rebinds waivers, generates the aggregate
#     (reference run_id = R2, the first non-gateway result), consolidates R1's
#     gateway dirs into R2 (rewriting the run_id embedded in gateway's chunk
#     stryker.config.json so it matches buildMutationChunkConfig(…, R2)),
#     publishes runs/R2/phase1.json (byte-identical to phase1/mutation.json),
#     runs check-mutation-thresholds, then re-uploads the canonical
#     phase1-mutation-{sha} artifact the attestation names.
#
# Trigger: workflow_dispatch only in practice. The push+paths filter fires once
# when this workflow file itself is committed; code pushes never re-trigger the
# ~22h suite.

on:
  workflow_dispatch:
  push:
    branches: [codex/phase2-integrated]
    paths:
      - '.github/workflows/phase1-mutation-full.yml'

permissions:
  contents: read

concurrency:
  group: phase1-mutation-full
  cancel-in-progress: false

jobs:
  gateway-mutation:
    runs-on: mac-mutation
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # build:root compiles root TS that imports @agent-harness/* workspace
      # packages, whose dist/ must exist first. build:workspaces must run before
      # `npm run build` (mirrors ci.yml's step order).
      - name: Build workspaces then root
        run: |
          npm run build:workspaces --silent
          npm run build --silent
      - name: Rebind mutation waivers to the verified commit
        env:
          VERIFY_COMMIT_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { computeMutationConfigurationHash } from './scripts/run-mutation.mjs';
          const commitSha = process.env.VERIFY_COMMIT_SHA;
          const configurationHash = computeMutationConfigurationHash();
          const path = './mutation/equivalent-mutants.json';
          const waivers = JSON.parse(readFileSync(path, 'utf8'));
          for (const w of waivers) {
            w.commitSha = commitSha;
            w.configurationHash = configurationHash;
          }
          writeFileSync(path, JSON.stringify(waivers, null, 2) + '\n');
          console.log(`rebound ${waivers.length} waivers -> ${commitSha} ${configurationHash}`);
          NODE
      - name: Run Gateway mutation suite
        run: npm run test:mutation:gateway
        timeout-minutes: 1320
      - name: Upload gateway mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase1-mutation-gateway-${{ github.sha }}
          path: reports/mutation/
          if-no-files-found: error

  rest-mutation:
    runs-on: mac-mutation
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build workspaces then root
        run: |
          npm run build:workspaces --silent
          npm run build --silent
      - name: Rebind mutation waivers to the verified commit
        env:
          VERIFY_COMMIT_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { computeMutationConfigurationHash } from './scripts/run-mutation.mjs';
          const commitSha = process.env.VERIFY_COMMIT_SHA;
          const configurationHash = computeMutationConfigurationHash();
          const path = './mutation/equivalent-mutants.json';
          const waivers = JSON.parse(readFileSync(path, 'utf8'));
          for (const w of waivers) {
            w.commitSha = commitSha;
            w.configurationHash = configurationHash;
          }
          writeFileSync(path, JSON.stringify(waivers, null, 2) + '\n');
          console.log(`rebound ${waivers.length} waivers -> ${commitSha} ${configurationHash}`);
          NODE
      - name: Run Rest mutation suite
        run: npm run test:mutation:rest
        timeout-minutes: 1320
      - name: Upload rest mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase1-mutation-rest-${{ github.sha }}
          path: reports/mutation/
          if-no-files-found: error

  verify:
    needs: [gateway-mutation, rest-mutation]
    runs-on: mac-mutation
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build workspaces then root
        run: |
          npm run build:workspaces --silent
          npm run build --silent
      - name: Download gateway mutation evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase1-mutation-gateway-${{ github.sha }}
          path: partial-gateway/
      - name: Download rest mutation evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase1-mutation-rest-${{ github.sha }}
          path: partial-rest/
      - name: Merge partial evidence trees
        run: |
          mkdir -p reports/mutation
          cp -R partial-gateway/reports/mutation/. reports/mutation/
          cp -R partial-rest/reports/mutation/. reports/mutation/
      - name: Rebind mutation waivers to the verified commit
        env:
          VERIFY_COMMIT_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { computeMutationConfigurationHash } from './scripts/run-mutation.mjs';
          const commitSha = process.env.VERIFY_COMMIT_SHA;
          const configurationHash = computeMutationConfigurationHash();
          const path = './mutation/equivalent-mutants.json';
          const waivers = JSON.parse(readFileSync(path, 'utf8'));
          for (const w of waivers) {
            w.commitSha = commitSha;
            w.configurationHash = configurationHash;
          }
          writeFileSync(path, JSON.stringify(waivers, null, 2) + '\n');
          console.log(`rebound ${waivers.length} waivers -> ${commitSha} ${configurationHash}`);
          NODE
      - name: Build Phase 1 aggregate report
        run: node scripts/generate-phase1-aggregate.mjs
      - name: Consolidate mutation run directories
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, readdirSync, cpSync, rmSync, existsSync } from 'node:fs';
          import { join } from 'node:path';
          const report = JSON.parse(readFileSync('reports/mutation/phase1/mutation.json', 'utf8'));
          const ref = report.run_id;
          const runsRoot = 'reports/mutation/runs';
          const refDir = join(runsRoot, ref);
          if (!existsSync(refDir)) throw new Error(`reference run dir missing: ${refDir}`);
          let rewritten = 0;
          for (const entry of readdirSync(runsRoot, { withFileTypes: true })) {
            if (!entry.isDirectory() || entry.name === ref) continue;
            const runDir = join(runsRoot, entry.name);
            for (const moduleEntry of readdirSync(runDir, { withFileTypes: true })) {
              if (!moduleEntry.isDirectory()) continue;
              const target = join(refDir, moduleEntry.name);
              if (existsSync(target)) {
                throw new Error(`run dir collision: ${target} (module sets must be disjoint)`);
              }
              cpSync(join(runDir, moduleEntry.name), target, { recursive: true });
              // Rewrite the run_id embedded in chunk stryker.config.json so it
              // matches buildMutationChunkConfig(moduleName, chunk, ref).
              const chunksDir = join(target, 'chunks');
              if (!existsSync(chunksDir)) continue;
              for (const chunkDir of readdirSync(chunksDir)) {
                const configPath = join(chunksDir, chunkDir, 'stryker.config.json');
                if (!existsSync(configPath)) continue;
                const text = readFileSync(configPath, 'utf8');
                const next = text.replaceAll(entry.name, ref);
                if (next !== text) {
                  writeFileSync(configPath, next);
                  rewritten += 1;
                }
              }
            }
            // The checker enforces an EXACT chunk file set across the whole
            // tree: any chunk file under the non-reference run dir would fail
            // 'artifact exact chunk file set'. Remove the source run dir.
            rmSync(runDir, { recursive: true, force: true });
          }
          console.log(`consolidated into ${ref}; rewrote run_id in ${rewritten} chunk configs`);
          NODE
      # Re-run the aggregate AFTER consolidation: the moved run's chunk
      # stryker.config.json was rewritten to embed the reference run_id, which
      # changes its bytes, so the aggregate must rebind every chunk's
      # config_sha256 to the final on-disk bytes the checker will hash.
      - name: Rebuild aggregate and publish reference run phase1.json
        run: |
          node scripts/generate-phase1-aggregate.mjs
          REF="$(node -e "const r=require('./reports/mutation/phase1/mutation.json');process.stdout.write(r.run_id)")"
          cp reports/mutation/phase1/mutation.json "reports/mutation/runs/$REF/phase1.json"
          echo "published runs/$REF/phase1.json"
      - name: Verify Phase 1 mutation thresholds
        env:
          EXPECTED_SHA: ${{ github.sha }}
          MUTATION_ARTIFACT_NAME: phase1-mutation-${{ github.sha }}
        run: |
          DIGEST="$(shasum -a 256 reports/mutation/phase1/mutation.json | cut -d' ' -f1)"
          echo "artifact_digest=$DIGEST"
          MUTATION_ARTIFACT_DIGEST="$DIGEST" node scripts/check-mutation-thresholds.mjs phase1
      - name: Upload canonical Phase 1 mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase1-mutation-${{ github.sha }}
          path: reports/mutation/
          if-no-files-found: error
