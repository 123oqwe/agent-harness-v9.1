name: Factory Gates
on:
  push:
    branches: [main, 'req/**']
  pull_request:
    branches: [main]

jobs:
  spec-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Download TLC
        run: curl -L -o spec/state-machines/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar
      - name: Run Spec Gate
        run: bash infra/ci-gate-spec.sh

  protected-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check no spec changes without approval
        run: |
          if git diff --name-only origin/main HEAD | grep -E '^(spec/contracts/|spec/state-machines/|spec/requirements/|spec/phases/)'; then
            echo "ERROR: Protected spec paths modified. Requires CTO approval."
            exit 1
          fi
