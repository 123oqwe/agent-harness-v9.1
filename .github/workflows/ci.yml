name: Phase 1 CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: phase1-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Linux sandbox authority
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap util-linux
          bwrap --ro-bind / / -- /usr/bin/prlimit --as=268435456 --nproc=32 -- /bin/true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:cycles
      - run: npm run build
      - run: npm run lint
      - name: Debug Hook sandbox execution
        run: |
          node -e '
          const { mkdtempSync, writeFileSync, rmSync, existsSync } = require("fs");
          const { join, dirname } = require("path");
          const { tmpdir } = require("os");
          const { spawn } = require("child_process");
          const root = mkdtempSync(join(tmpdir(), "ah-hook-debug-"));
          const script = join(root, "hook.mjs");
          writeFileSync(script, [
            "const chunks = [];",
            "for await (const c of process.stdin) chunks.push(c);",
            "process.stdout.write(JSON.stringify({ action: \"observe\", follow_up: { leaked: process.env.HOOK_HOST_SECRET ?? null } }));",
          ].join("\n"), { mode: 0o400 });
          const nodeBin = process.execPath;
          const nodeDir = dirname(nodeBin);
          const sysRoots = ["/usr","/bin","/sbin","/lib","/lib64"].filter(existsSync).flatMap(p => ["--ro-bind",p,p]);
          function runTest(label, extraArgs) {
            return new Promise((resolve) => {
              const args = ["--unshare-all","--new-session","--proc","/proc","--dev","/dev","--tmpfs","/tmp",
                ...sysRoots, "--ro-bind",nodeDir,nodeDir, "--bind",root,root,
                "--die-with-parent","--hostname","sandbox","--",
                "/usr/bin/prlimit","--nproc=8","--",
                nodeBin, ...extraArgs];
              const child = spawn("bwrap", args, {
                cwd: root, env: { PATH: process.env.PATH, HOME: root, TMPDIR: root, LANG: "C.UTF-8" },
                stdio: ["pipe","pipe","pipe"], detached: true
              });
              child.stdin.write(JSON.stringify({event:"pre_tool_use",invocation_id:"t",scope:{tenant_id:"t",run_id:"r",session_id:"s",operation_id:"o",attempt_id:"a"},payload:{mode:"env"}}));
              child.stdin.end();
              let stdout = "", stderr = "";
              child.stdout.on("data", d => stdout += d);
              child.stderr.on("data", d => stderr += d);
              const to = setTimeout(() => { try { process.kill(-child.pid, "SIGKILL"); } catch {} }, 10000);
              child.on("close", code => { clearTimeout(to); console.log(label, "exit:", code, "stdout:", stdout.slice(0,300), "stderr:", stderr.slice(0,500)); resolve(); });
            });
          }
          (async () => {
            await runTest("A(preserve-symlinks-main file):", ["--preserve-symlinks-main", script]);
            await runTest("B(no-preserve-symlinks file):", [script]);
            await runTest("C(node -e inline):", ["-e", "process.stdout.write(JSON.stringify({ok:true}))"]);
            rmSync(root, { recursive: true, force: true });
          })();
          '
      - run: npm test -- --maxWorkers=1
      - run: npm run test:coverage -- --maxWorkers=1
      - run: npm audit --omit=dev --audit-level=high
      - run: npm pack --dry-run --ignore-scripts
