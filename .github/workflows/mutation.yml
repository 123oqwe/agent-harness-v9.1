name: Phase 1 Mutation

on:
  workflow_dispatch:
    inputs:
      target:
        description: Mutation target to run
        required: true
        default: phase1
        type: choice
        options:
          - phase1
          - gateway
          - router
          - toolsRegistry
          - toolsLeaf
          - skills
          - strategies
          - actionControl
          - identitySecrets
          - vfs
          - sandbox
          - session
          - runtime
          - verification
          - verticals
          - uiAdapters

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux sandbox authority
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap util-linux
          bwrap --ro-bind / / -- /usr/bin/prlimit --as=268435456 --nproc=32 -- /bin/true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run mutation target
        env:
          MUTATION_TARGET: ${{ inputs.target }}
        run: node scripts/run-mutation.mjs "$MUTATION_TARGET"
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-mutation-${{ github.sha }}
          path: reports/mutation/
          if-no-files-found: error
