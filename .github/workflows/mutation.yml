name: Phase 1 Mutation

on:
  workflow_dispatch:
    inputs:
      target:
        description: Mutation target to run
        required: true
        default: phase1
        type: choice
        options:
          - phase1
          - gateway
          - router
          - toolsRegistry
          - toolsLeaf
          - skills
          - strategies
          - actionControl
          - identitySecrets
          - vfs
          - sandbox
          - session
          - runtime
          - verification
          - verticals
          - uiAdapters

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Linux sandbox authority
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap util-linux
          bwrap --ro-bind / / -- /usr/bin/prlimit --as=268435456 --nproc=32 -- /bin/true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run mutation target
        env:
          MUTATION_TARGET: ${{ inputs.target }}
        run: node scripts/run-mutation.mjs "$MUTATION_TARGET"
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutation-${{ inputs.target }}-${{ github.sha }}
          path: reports/mutation/
          if-no-files-found: error
